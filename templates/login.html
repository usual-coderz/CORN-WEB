<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with Telegram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #0088cc, #00aced);
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .telegram-btn {
            display: inline-block;
            margin-top: 10px;
        }
        .info {
            margin-top: 25px;
            padding: 15px;
            background: #f0f9ff;
            border-radius: 10px;
            font-size: 13px;
            color: #666;
        }
        .loading {
            display: none;
            margin-top: 20px;
        }
        .loading.active {
            display: block;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0088cc;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">✈️</div>
        <h1>Login with Telegram</h1>
        <p>Click the button below to authenticate securely with your Telegram account. Your phone number and profile will be automatically fetched.</p>
        
        <!-- Telegram Login Widget -->
        <script async src="https://telegram.org/js/telegram-widget.js?22" 
            data-telegram-login="{{ bot_username }}" 
            data-size="large" 
            data-onauth="onTelegramAuth(user)" 
            data-request-access="write">
        </script>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Verifying...</p>
        </div>
        
        <div class="info">
            🔒 Your data is verified directly by Telegram. We never see your password.
        </div>
    </div>

    <script>
        async function onTelegramAuth(user) {
            console.log("Telegram auth received:", user);
            
            document.getElementById('loading').classList.add('active');
            
            try {
                const response = await fetch('/api/auth/telegram', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(user)
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    window.location.href = '/';
                } else {
                    alert('Login failed: ' + (data.error || 'Unknown error'));
                    document.getElementById('loading').classList.remove('active');
                }
            } catch (e) {
                alert('Network error. Please try again.');
                document.getElementById('loading').classList.remove('active');
            }
        }
        
        // Check if already logged in
        fetch('/api/user')
            .then(r => r.json())
            .then(data => {
                if (data.ok) window.location.href = '/';
            });
    </script>
</body>
</html>
