<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corn Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .otp-section {
            display: none;
            animation: slideIn 0.3s ease;
        }
        .otp-section.active {
            display: block;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #msg {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .timer {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🌽 Corn Login</h2>
        
        <!-- Step 1: Phone & Details -->
        <div id="step1">
            <div class="input-group">
                <input type="text" id="name" placeholder="Your Name" autocomplete="name">
            </div>
            <div class="input-group">
                <input type="text" id="tg_id" placeholder="Telegram ID (optional)">
            </div>
            <div class="input-group">
                <input type="tel" id="phone" placeholder="Phone (with country code, e.g., +91...)" autocomplete="tel">
            </div>
            <button onclick="sendOtp()" id="sendBtn">Send OTP</button>
            <p class="timer" id="timer"></p>
        </div>
        
        <!-- Step 2: OTP Verification -->
        <div id="step2" class="otp-section">
            <div class="input-group">
                <input type="text" id="otp" placeholder="Enter 5-digit OTP" maxlength="5">
            </div>
            <button onclick="verify()" id="verifyBtn">Login</button>
            <button onclick="resendOtp()" style="margin-top: 10px; background: #6c757d;">Resend OTP</button>
        </div>
        
        <p id="msg"></p>
    </div>

    <script>
        let countdown;
        let canResend = true;
        
        function showMsg(text, type = 'info') {
            const msg = document.getElementById('msg');
            msg.textContent = text;
            msg.className = type;
        }
        
        async function sendOtp() {
            const phone = document.getElementById('phone').value.trim();
            const name = document.getElementById('name').value.trim();
            
            if (!phone || phone.length < 10) {
                showMsg('Please enter valid phone number with country code', 'error');
                return;
            }
            
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            
            try {
                const r = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phone, name})
                });
                
                const data = await r.json();
                
                if (r.ok) {
                    showMsg('✅ OTP sent! Check your phone/SMS', 'success');
                    document.getElementById('step2').classList.add('active');
                    startTimer();
                } else {
                    showMsg(data.error || 'Failed to send OTP', 'error');
                    btn.disabled = false;
                }
            } catch (e) {
                showMsg('Network error. Try again.', 'error');
                btn.disabled = false;
            }
        }
        
        function startTimer() {
            let timeLeft = 60;
            const timerEl = document.getElementById('timer');
            const btn = document.getElementById('sendBtn');
            
            clearInterval(countdown);
            canResend = false;
            
            countdown = setInterval(() => {
                timerEl.textContent = `Resend OTP in ${timeLeft}s`;
                timeLeft--;
                
                if (timeLeft < 0) {
                    clearInterval(countdown);
                    timerEl.textContent = '';
                    btn.disabled = false;
                    canResend = true;
                }
            }, 1000);
        }
        
        async function verify() {
            const phone = document.getElementById('phone').value.trim();
            const otp = document.getElementById('otp').value.trim();
            const name = document.getElementById('name').value.trim();
            const tg_id = document.getElementById('tg_id').value.trim();
            
            if (!otp || otp.length !== 5) {
                showMsg('Please enter 5-digit OTP', 'error');
                return;
            }
            
            const btn = document.getElementById('verifyBtn');
            btn.disabled = true;
            btn.textContent = 'Verifying...';
            
            try {
                const r = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phone, otp, name, tg_id})
                });
                
                const data = await r.json();
                
                if (r.ok) {
                    showMsg('✅ Login successful! Redirecting...', 'success');
                    setTimeout(() => location.href = '/', 1000);
                } else {
                    showMsg(data.error || 'Invalid OTP', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Login';
                }
            } catch (e) {
                showMsg('Network error. Try again.', 'error');
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }
        
        async function resendOtp() {
            if (!canResend) return;
            document.getElementById('step2').classList.remove('active');
            await sendOtp();
        }
        
        // Allow Enter key to submit
        document.getElementById('otp')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verify();
        });
    </script>
</body>
</html>
