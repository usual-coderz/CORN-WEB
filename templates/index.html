<!-- I'm not a robot gate -->
<div id="robotGate">
  <label><input type="checkbox" id="rb"> I'm not a robot 🤖</label>
  <button onclick="passGate()">Enter</button>
</div>

<div id="content" style="display:none">
  <h2>Welcome, {{ user.name }}</h2>
  <!-- 5 videos: apne links yaha daalo -->
  <iframe width="560" height="315" src="VIDEO_LINK_1"></iframe>
  <iframe width="560" height="315" src="VIDEO_LINK_2"></iframe>
  <iframe width="560" height="315" src="VIDEO_LINK_3"></iframe>
  <iframe width="560" height="315" src="VIDEO_LINK_4"></iframe>
  <iframe width="560" height="315" src="VIDEO_LINK_5"></iframe>
  <a href="/logout">Logout</a>
</div>

<script>
function passGate(){
  if(rb.checked){
    fetch('/api/captcha',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:'human-verified'})})
      .then(()=>{robotGate.style.display='none';content.style.display='block';});
  }
}
// Logout/tab-close detection: heartbeat every 15s
setInterval(()=>navigator.sendBeacon('/api/heartbeat'),15000);
</script>
