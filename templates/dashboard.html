<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Created</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #00d4aa, #00a884);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        h1 { color: #00d4aa; margin-bottom: 10px; }
        .info {
            background: rgba(0,212,170,0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .info-row:last-child { border-bottom: none; }
        .label { color: #888; }
        .value { color: #fff; font-family: monospace; }
        .session-box {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #00d4aa;
            border: 1px solid #00d4aa;
        }
        button {
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✓</div>
        <h1>Session Created!</h1>
        <p>Your Pyrogram session has been generated and saved.</p>
        
        <div class="info">
            <div class="info-row">
                <span class="label">Name</span>
                <span class="value">{{ user.name }}</span>
            </div>
            <div class="info-row">
                <span class="label">Username</span>
                <span class="value">@{{ user.username }}</span>
            </div>
            <div class="info-row">
                <span class="label">User ID</span>
                <span class="value">{{ user.id }}</span>
            </div>
            <div class="info-row">
                <span class="label">Phone</span>
                <span class="value">{{ user.phone }}</span>
            </div>
        </div>
        
        <p>Private Videos Available Soon.</p>
        
        <button onclick="logout()">Create Another</button>
    </div>
    
    <script>
        async function logout() {
            await fetch('/api/logout', {method: 'POST'});
            window.location.href = '/login';
        }
    </script>
</body>
</html>
